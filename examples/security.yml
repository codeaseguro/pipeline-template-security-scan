# Copiá este archivo a .github/workflows/security.yml en cada proyecto consumidor.
name: Security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1" # escaneo completo semanal (historial git, nuevos CVEs)
  workflow_dispatch:

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

# El workflow llamado sólo puede usar los permisos que se le otorgan acá.
permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  security:
    uses: codeaseguro/pipeline-template-security-scan/.github/workflows/security-scan.yml@v1
    with:
      languages: auto            # o "java,javascript" para forzar
      fail-on-severity: high     # none | critical | high | medium | low
      upload-sarif: true         # false si el repo es privado sin GitHub Advanced Security
      # --- Java (opcional) ---
      # java-version: "17"
      # java-build-command: ./mvnw -B -pl api -am -DskipTests compile
      # enable-spotbugs: false   # sólo Semgrep, sin compilar
