# Capa agnóstica al lenguaje: corre en TODOS los repos.
#   - Semgrep : SAST multi-lenguaje (patrones OWASP, inyecciones, crypto débil...)
#   - Gitleaks: secretos en el historial git
#   - Trivy   : SCA (dependencias vulnerables) + misconfig IaC (Dockerfile, Terraform, K8s)
name: SAST - Common

on:
  workflow_call:
    inputs:
      fail-on-severity:
        type: string
        default: high
      exclude-paths:
        type: string
        default: node_modules,vendor,dist,build,target,coverage,third_party
      upload-sarif:
        type: boolean
        default: true
      semgrep-config:
        type: string
        default: p/default

permissions:
  contents: read

env:
  SEMGREP_VERSION: "1.179.0"
  GITLEAKS_VERSION: "8.30.1"
  GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
  TRIVY_VERSION: "0.75.0"

jobs:
  semgrep:
    name: Semgrep
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Semgrep
        run: pipx install "semgrep==${SEMGREP_VERSION}"

      - name: Run Semgrep
        shell: bash
        env:
          SEMGREP_CONFIG: ${{ inputs.semgrep-config }}
          EXCLUDE_PATHS: ${{ inputs.exclude-paths }}
        run: |
          set -uo pipefail
          args=(scan --metrics=off --sarif --output semgrep.sarif)
          for c in $SEMGREP_CONFIG; do args+=(--config "$c"); done
          # Reglas propias del proyecto consumidor
          [ -d .semgrep ] && args+=(--config .semgrep)
          IFS=',' read -ra excl <<<"$EXCLUDE_PATHS"
          for e in "${excl[@]}"; do [ -n "$e" ] && args+=(--exclude "$e"); done
          semgrep "${args[@]}" .

      - uses: codeaseguro/pipeline-template-security-scan/.github/actions/sarif-report@v1
        with:
          sarif-file: semgrep.sarif
          category: semgrep
          fail-on-severity: ${{ inputs.fail-on-severity }}
          upload-sarif: ${{ inputs.upload-sarif }}

  gitleaks:
    name: Gitleaks (secrets)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Gitleaks (checksum verificado)
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          curl -sSfL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Run Gitleaks
        id: scan
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -uo pipefail
          args=(git --redact --no-banner --report-format sarif --report-path gitleaks.sarif --exit-code 2)
          # En PRs sólo se escanean los commits nuevos; en push/schedule todo el historial.
          if [ "$EVENT_NAME" = "pull_request" ] || [ "$EVENT_NAME" = "pull_request_target" ]; then
            args+=(--log-opts="${BASE_SHA}..${HEAD_SHA}")
          fi
          # .gitleaks.toml / .gitleaksignore en la raíz del repo se toman automáticamente.
          rc=0; gitleaks "${args[@]}" . || rc=$?
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          if [ "$rc" -eq 1 ]; then echo "::error::Gitleaks terminó con error"; exit 1; fi

      # Los secretos bloquean con cualquier umbral distinto de "none" (no tienen severidad CVSS).
      - uses: codeaseguro/pipeline-template-security-scan/.github/actions/sarif-report@v1
        with:
          sarif-file: gitleaks.sarif
          category: gitleaks
          fail-on-severity: none
          upload-sarif: ${{ inputs.upload-sarif }}

      - name: Secrets gate
        if: steps.scan.outputs.rc == '2' && inputs.fail-on-severity != 'none'
        run: |
          echo "::error::Gitleaks detectó secretos. Rotalos y removelos del historial (o agregalos a .gitleaksignore si son falsos positivos)."
          exit 1

  trivy:
    name: Trivy (SCA + IaC)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Cache Trivy DB
        uses: actions/cache@v6
        with:
          path: ~/.cache/trivy
          key: trivy-db-${{ runner.os }}-${{ github.run_id }}
          restore-keys: trivy-db-${{ runner.os }}-

      - name: Run Trivy
        shell: bash
        env:
          EXCLUDE_PATHS: ${{ inputs.exclude-paths }}
        run: |
          set -euo pipefail
          skip=$(tr ',' '\n' <<<"$EXCLUDE_PATHS" | sed '/^$/d; s|^|**/|' | paste -sd, -)
          mkdir -p "$HOME/.cache/trivy"
          docker run --rm \
            -v "$PWD:/src" -v "$HOME/.cache/trivy:/root/.cache/trivy" -w /src \
            "aquasec/trivy:${TRIVY_VERSION}" fs \
            --scanners vuln,misconfig \
            --format sarif --output /src/trivy.sarif \
            ${skip:+--skip-dirs "$skip"} \
            --exit-code 0 .
          sudo chown "$(id -u):$(id -g)" trivy.sarif

      - uses: codeaseguro/pipeline-template-security-scan/.github/actions/sarif-report@v1
        with:
          sarif-file: trivy.sarif
          category: trivy
          fail-on-severity: ${{ inputs.fail-on-severity }}
          upload-sarif: ${{ inputs.upload-sarif }}
